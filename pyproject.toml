[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decoupattn"
version = "0.1.0"
description = "DecoupAttn: decoupled sparse attention for training-free acceleration of video diffusion"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.5", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
kernels = ["triton>=3.1", "flashinfer-python==0.2.10"]
eval = ["lpips>=0.1.4", "imageio>=2.34", "pillow>=10"]
models = ["pillow", "safetensors", "transformers", "opencv-python"]
dev = ["pytest>=8", "ruff>=0.6", "scipy>=1.11"]

[project.scripts]
decoupattn = "decoupattn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
